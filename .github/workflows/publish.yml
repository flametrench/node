name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish ("all" for full v0.3 cohort, or a single package name)'
        required: true
        default: '@flametrench/identity'
        type: choice
        options:
          - '@flametrench/identity'
          - all
          - '@flametrench/ids'
          - '@flametrench/tenancy'
          - '@flametrench/authz'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build

      # --access public is required for all @flametrench/* scoped packages.
      # pnpm publish defaults to --tag latest for stable (non-prerelease) versions,
      # so 0.3.1 will land on latest and displace 0.2.1 automatically.
      # Publish in dependency order: ids → identity → tenancy → authz.

      - name: Publish @flametrench/ids
        if: inputs.package == 'all' || inputs.package == '@flametrench/ids'
        run: pnpm publish --filter "@flametrench/ids" --access public --no-git-checks

      - name: Publish @flametrench/identity (v0.3.1 — CWE-208 security fix)
        if: inputs.package == 'all' || inputs.package == '@flametrench/identity'
        run: pnpm publish --filter "@flametrench/identity" --access public --no-git-checks

      - name: Publish @flametrench/tenancy
        if: inputs.package == 'all' || inputs.package == '@flametrench/tenancy'
        run: pnpm publish --filter "@flametrench/tenancy" --access public --no-git-checks

      - name: Publish @flametrench/authz
        if: inputs.package == 'all' || inputs.package == '@flametrench/authz'
        run: pnpm publish --filter "@flametrench/authz" --access public --no-git-checks
