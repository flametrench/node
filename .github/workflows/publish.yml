name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish ("all" for full v0.4 cohort, or a single package name)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '@flametrench/ids'
          - '@flametrench/audit'
          - '@flametrench/file'
          - '@flametrench/flags'
          - '@flametrench/notify'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build

      # v0.4 cohort — publish in dependency order: ids first, then the four primitives.
      # identity/tenancy/authz are already live on npm (0.3.x) and are NOT in this batch.
      # --access public is required for all @flametrench/* scoped packages.

      - name: Publish @flametrench/ids
        if: inputs.package == 'all' || inputs.package == '@flametrench/ids'
        run: pnpm publish --filter "@flametrench/ids" --access public --no-git-checks

      - name: Publish @flametrench/audit
        if: inputs.package == 'all' || inputs.package == '@flametrench/audit'
        run: pnpm publish --filter "@flametrench/audit" --access public --no-git-checks

      - name: Publish @flametrench/file
        if: inputs.package == 'all' || inputs.package == '@flametrench/file'
        run: pnpm publish --filter "@flametrench/file" --access public --no-git-checks

      - name: Publish @flametrench/flags
        if: inputs.package == 'all' || inputs.package == '@flametrench/flags'
        run: pnpm publish --filter "@flametrench/flags" --access public --no-git-checks

      - name: Publish @flametrench/notify
        if: inputs.package == 'all' || inputs.package == '@flametrench/notify'
        run: pnpm publish --filter "@flametrench/notify" --access public --no-git-checks
