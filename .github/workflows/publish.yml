name: publish

on:
  workflow_dispatch: # Manual trigger — guarded until npm Trusted Publisher is live

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      - run: pnpm publish --filter "@flametrench/ids" --access public --no-git-checks
      - run: pnpm publish --filter "@flametrench/identity" --access public --no-git-checks
      - run: pnpm publish --filter "@flametrench/tenancy" --access public --no-git-checks
      - run: pnpm publish --filter "@flametrench/authz" --access public --no-git-checks
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
